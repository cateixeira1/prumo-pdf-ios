# Projeto do Xcode gerado pelo XcodeGen (o build na nuvem roda `xcodegen generate`).
name: PrumoPDF
options:
  bundleIdPrefix: br.com.prumopdf
  deploymentTarget:
    iOS: "17.0"
  # Inglês como idioma de desenvolvimento: iPhone em idioma sem tradução (italiano, por exemplo) vê o
  # Prumo em inglês. O português vem de pt.lproj (as chaves das traduções já são o texto em português).
  developmentLanguage: en
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    MARKETING_VERSION: "1.14.0"
    CURRENT_PROJECT_VERSION: "15"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
    ENABLE_USER_SCRIPT_SANDBOXING: "YES"
targets:
  PrumoPDF:
    type: application
    platform: iOS
    sources:
      - path: PrumoPDF
    info:
      path: PrumoPDF/Info.plist
      properties:
        CFBundleDisplayName: Prumo PDF
        CFBundleDevelopmentRegion: en
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        # traduzidos em PrumoPDF/Localization/<idioma>.lproj/InfoPlist.strings (scripts/locales/infoplist.json)
        NSCameraUsageDescription: The camera is used to scan documents. The images stay only on this iPhone.
        NSFaceIDUsageDescription: Face ID unlocks Prumo PDF, if you turn on the lock in Settings, and confirms digital signatures.
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        CFBundleDocumentTypes:
          - CFBundleTypeName: PDF
            CFBundleTypeRole: Editor
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - com.adobe.pdf
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: br.com.prumopdf.app
        PRODUCT_NAME: PrumoPDF
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: NO
  PrumoPDFTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: PrumoPDFTests
    dependencies:
      - target: PrumoPDF
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: br.com.prumopdf.tests
schemes:
  PrumoPDF:
    build:
      targets:
        PrumoPDF: all
        PrumoPDFTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      # os testes rodam em português (os textos esperados estão em português); os outros idiomas são
      # conferidos em PrumoPDFTests/I18nTests.swift
      language: pt-BR
      region: BR
      commandLineArguments:
        "-AppleLanguages (pt-BR)": true
        "-AppleLocale pt_BR": true
      targets:
        - PrumoPDFTests
    archive:
      config: Release
