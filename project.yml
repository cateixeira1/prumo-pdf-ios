# Projeto do Xcode gerado pelo XcodeGen (o build na nuvem roda `xcodegen generate`).
name: PrumoPDF
options:
  bundleIdPrefix: br.com.prumopdf
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: pt-BR
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    MARKETING_VERSION: "1.4.0"
    CURRENT_PROJECT_VERSION: "5"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
    ENABLE_USER_SCRIPT_SANDBOXING: "YES"
targets:
  PrumoPDF:
    type: application
    platform: iOS
    sources:
      - path: PrumoPDF
    info:
      path: PrumoPDF/Info.plist
      properties:
        CFBundleDisplayName: Prumo PDF
        CFBundleDevelopmentRegion: pt-BR
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        NSCameraUsageDescription: A câmera é usada para escanear documentos. As imagens ficam só neste iPhone.
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        CFBundleDocumentTypes:
          - CFBundleTypeName: PDF
            CFBundleTypeRole: Editor
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - com.adobe.pdf
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: br.com.prumopdf.app
        PRODUCT_NAME: PrumoPDF
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: NO
  PrumoPDFTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: PrumoPDFTests
    dependencies:
      - target: PrumoPDF
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: br.com.prumopdf.tests
schemes:
  PrumoPDF:
    build:
      targets:
        PrumoPDF: all
        PrumoPDFTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - PrumoPDFTests
    archive:
      config: Release
